name: Build Creator Downloader for Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch the AI runtime
        run: bash ci/vendor.sh

      - name: Bundle the app interface
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www
          rm -f android/app/src/main/assets/www/sw.js

      - name: Build signed APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CreatorDownloader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CreatorDownloader-APK
          path: CreatorDownloader.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CreatorDownloader.apk \
            --title "Creator Downloader for Android" \
            --notes "Tap CreatorDownloader.apk to download, then open it to install. Built from ${GITHUB_SHA::7}."

      - name: Keep the build log if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  test-web:
    name: Test in Chrome (phone size, real libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the AI runtime
        run: bash ci/vendor.sh
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run self-test
        run: node ci/web-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-web
          path: ci-out-web

  test-android:
    name: Test on Android emulator (real libraries)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CreatorDownloader-APK
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run self-test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: bash ci/emu-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-android
          path: ci-out

  report:
    name: Publish test results
    needs: [test-web, test-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-*
          path: results
      - name: Push results to the ci-results branch
        run: |
          mkdir -p results && cd results
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b ci-results
          git config user.name "CI" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Test results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
